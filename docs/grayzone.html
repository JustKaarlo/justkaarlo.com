    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>

        // Initialize particles
        particlesJS('particles-js', {
            particles: {
                number: { value: 30, density: { enable: true, value_area: 600 } },
                color: { value: ['#54612a'] },
                shape: { type: 'triangle' },
                opacity: { value: 0.4, random: true, anim: { enable: true, speed: 0.3, opacity_min: 0.2, sync: false } },
                size: { value: 4, random: true, anim: { enable: true, speed: 2, size_min: 1, sync: false } },
                line_linked: { enable: true, color: '#54612a', opacity: 1 },
                move: { enable: true, speed: 0.09, direction: 'random', random: true, straight: false, out_mode: 'out', bounce: true }
            },
            interactivity: { detect_on: 'canvas', events: { onhover: { enable: false }, onclick: { enable: false }, resize: true } },
            retina_detect: true
        });
    </script>
